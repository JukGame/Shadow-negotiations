<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shadow Fight 2: Переговоры — Битва теней (обновлённая)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #0a0c0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Impact', system-ui, sans-serif;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 1300px;
            background: transparent;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }

        /* фон арены — заданное изображение, растянуто */
        .arena-bg {
            background: url('https://avatars.mds.yandex.net/i?id=aeb91f317c938092586b86fb8138f69c_sr-9270532-images-thumbs&n=13') center center / cover no-repeat;
            position: relative;
            padding: 20px 20px 15px 20px;
            min-height: 580px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ряд бойцов — прижимаем к низу фона */
        .fighters-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            position: relative;
            z-index: 5;
            flex-wrap: wrap;
            margin-top: auto;      /* прижимаем к низу */
            margin-bottom: 5px;
        }

        /* карточки бойцов: прозрачный фон, без лишних обводок */
        .fighter-card {
            flex: 1;
            min-width: 240px;
            text-align: center;
            background: transparent;   /* полностью прозрачный */
            backdrop-filter: none;
            border: none;
            box-shadow: none;
            padding: 10px 12px 0px 12px;
            display: flex;
            flex-direction: column;
        }

        .fighter-card h3 {
            color: #ffefb0;
            text-shadow: 0 2px 5px black;
            font-size: 1.4rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.4);
            display: inline-block;
            align-self: center;
            padding: 4px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        /* шкала здоровья — слегка затемнена для читаемости */
        .health-wrapper {
            background: #2a1c0ccc;
            border-radius: 30px;
            padding: 5px;
            margin: 8px 10px;
            box-shadow: inset 0 1px 4px black;
            backdrop-filter: blur(4px);
        }
        .health-fill {
            height: 24px;
            border-radius: 30px;
            background: #d6451f;
            width: 100%;
            transition: width 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            background-image: linear-gradient(90deg, #e96b42, #b02a0a);
        }
        .health-text {
            color: #ffefb3;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 5px;
            text-shadow: 0 1px 2px black;
        }

        /* контейнер для спрайтов теней — прижат к низу, прозрачный */
        .shadow-sprite-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            min-height: 230px;
            margin-top: auto;
            position: relative;
        }
        .fighter-img {
            display: block;
            width: auto;
            height: 220px;          /* фиксированная высота для единого масштаба */
            max-width: 100%;
            object-fit: contain;    /* сохраняем пропорции, не растягиваем */
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.8));
            transition: transform 0.1s ease;
            pointer-events: none;
        }

        /* тряска при получении удара */
        .hit-shake {
            animation: shakeImpact 0.25s ease-in-out 0s 2;
        }
        @keyframes shakeImpact {
            0% { transform: translateX(0px) rotate(0deg); }
            50% { transform: translateX(-8px) rotate(1deg); }
            100% { transform: translateX(0px) rotate(0deg); }
        }

        /* падение тени */
        .fall-down {
            animation: fallAnim 0.6s forwards !important;
        }
        @keyframes fallAnim {
            0% { opacity: 1; transform: translateY(0) rotate(0deg); }
            70% { opacity: 0.6; transform: translateY(70px) rotate(25deg); }
            100% { opacity: 0; transform: translateY(130px) rotate(45deg); visibility: hidden; }
        }

        /* панель вопросов (полупрозрачная, но читаемая) */
        .quiz-panel {
            background: #0f0e07dd;
            backdrop-filter: blur(18px);
            margin: 20px 15px 15px;
            border-radius: 60px;
            padding: 20px;
            border: 1px solid #cbae5e;
            box-shadow: 0 8px 20px black;
        }
        .question-text {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            color: #fff2cf;
            text-shadow: 0 2px 3px black;
            padding: 12px;
            min-height: 90px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
            margin: 20px 0 15px;
        }
        .opt-btn {
            background: #2f2a18;
            border: 2px solid #bd973b;
            border-radius: 60px;
            padding: 14px 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff3cf;
            text-align: center;
            cursor: pointer;
            transition: 0.07s linear;
            font-family: inherit;
            box-shadow: 0 5px 0 #5a401a;
        }
        .opt-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #5a401a;
        }
        .opt-btn.disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        .message-area {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 10px;
            color: #ffd966;
            text-shadow: 0 2px 0 #3e2a00;
        }
        .restart-btn {
            background: #5e3a20;
            border: none;
            font-size: 1.3rem;
            padding: 12px 35px;
            border-radius: 60px;
            font-weight: bold;
            color: #ffefb0;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.07s linear;
            box-shadow: 0 5px 0 #2f1f0e;
            display: inline-block;
        }
        .restart-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2f1f0e;
        }

        /* линия удара поверх конкретной тени */
        .impact-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 8px;
            background: white;
            box-shadow: 0 0 20px 8px rgba(255, 30, 0, 0.9);
            border-radius: 6px;
            pointer-events: none;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.02s;
        }

        .text-center { text-align: center; }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #c9bc82;
            padding: 12px;
            background: rgba(0,0,0,0.4);
        }

        @media (max-width: 780px) {
            .fighters-row { flex-direction: column; align-items: stretch; }
            .fighter-card { margin-bottom: 5px; }
            .question-text { font-size: 1.2rem; }
            .fighter-img { height: 180px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="arena-bg">
        <div class="fighters-row">
            <!-- Левый боец (обучающийся) -->
            <div class="fighter-card" id="fighterLeftCard">
                <h3>⚡ ОБУЧАЮЩИЙСЯ ⚡</h3>
                <div class="health-wrapper">
                    <div class="health-fill" id="healthLeftFill" style="width: 100%"></div>
                    <div class="health-text" id="healthLeftText">ЗДОРОВЬЕ: 100%</div>
                </div>
                <div class="shadow-sprite-container" id="leftSpriteBox">
                    <img id="leftFighterImg" class="fighter-img" src="https://s.fotora.ru/8ef7a84f80a6d51b.png" alt="боец тень">
                </div>
            </div>

            <!-- Правый боец (Курс продаж) -->
            <div class="fighter-card" id="fighterRightCard">
                <h3>📜 КУРС ПРОДАЖ ⚔️</h3>
                <div class="health-wrapper">
                    <div class="health-fill" id="healthRightFill" style="width: 100%"></div>
                    <div class="health-text" id="healthRightText">ЗДОРОВЬЕ: 100%</div>
                </div>
                <div class="shadow-sprite-container" id="rightSpriteBox">
                    <img id="rightFighterImg" class="fighter-img" src="https://s.fotora.ru/217d626d77e43593.png" alt="курс тень">
                </div>
            </div>
        </div>
    </div>

    <div class="quiz-panel">
        <div class="question-text" id="questionText">Загрузка боевого вызова...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="message-area" id="gameMessage"></div>
        <div class="text-center"><button class="restart-btn" id="restartButton" style="display: none;">⚔️ НОВАЯ СХВАТКА ⚔️</button></div>
    </div>
    <footer>🎋 Каждый верный ответ — удар по курсу. Два верных подряд — удар ногой (-20%)! Ошибаешься дважды — получаешь ногой. 🎋</footer>
</div>

<script>
    (function(){
        // ---------- БАЗА ВОПРОСОВ (переговоры и продажи) ----------
        const RAW_QUESTIONS = [
            { text: "Что является самым важным первым шагом в любых переговорах?", 
              options: ["Установление взаимопонимания (раппорт)", "Сразу назвать цену", "Ультиматум оппоненту", "Игнорировать возражения"], 
              correct: 0 },
            { text: "Какой метод продаж основан на выявлении скрытых потребностей через ситуационные, проблемные и извлекающие вопросы?", 
              options: ["SPIN-продажи", "Холодные звонки", "Метод 'Взрыв'", "Агрессивный клоуз"], 
              correct: 0 },
            { text: "Что означает аббревиатура BATNA в теории переговоров?", 
              options: ["Лучшая альтернатива обсуждаемому соглашению", "Базовый анализ торгов", "Быстрая тактика наступления", "Бюджетное ограничение"], 
              correct: 0 },
            { text: "Клиент говорит: «Это слишком дорого». Какой ответ лучше всего?", 
              options: ["Почему вы так считаете? Давайте разберём ценность для вас", "У конкурентов ещё дороже", "Тогда не берите", "Скидка возможна только при заказе двух"], 
              correct: 0 },
            { text: "Какой стиль переговоров создаёт долгосрочное партнёрство и выигрыш для обеих сторон?", 
              options: ["Сотрудничество", "Компромисс", "Конкуренция", "Избегание"], 
              correct: 0 },
            { text: "Что нужно сделать сразу после успешной продажи, чтобы закрепить лояльность?", 
              options: ["Поблагодарить и запросить обратную связь", "Предложить ещё одну продажу", "Исчезнуть до следующего раза", "Напомнить об оплате"], 
              correct: 0 },
            { text: "Какая техника помогает перевести возражение в потребность?", 
              options: ["Присоединение + вопрос «Почему это важно?»", "Давление авторитетом", "Агрессивный скидочный маневр", "Смена темы"], 
              correct: 0 },
            { text: "В переговорах «якорение» — это...", 
              options: ["Первое предложение, задающее рамки обсуждения", "Жесткое завершение диалога", "Игнорирование контраргументов", "Личная атака на оппонента"], 
              correct: 0 },
            { text: "Что лучше всего помогает выявить истинные мотивы клиента?", 
              options: ["Открытые вопросы (как? почему? зачем?)", "Закрытые вопросы да/нет", "Монолог о преимуществах", "Быстрая презентация"], 
              correct: 0 },
            { text: "Как поступить, если переговоры зашли в тупик?", 
              options: ["Сделать паузу и предложить рассмотреть альтернативы (BATNA)", "Повысить давление", "Уйти с позором", "Согласиться на любые условия"], 
              correct: 0 }
        ];

        // Перемешивание вариантов ответа
        function shuffleOptions(q) {
            const opts = [...q.options];
            const correctText = opts[q.correct];
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            const newCorrectIndex = opts.indexOf(correctText);
            return { text: q.text, options: opts, correct: newCorrectIndex };
        }

        let shuffledQuestions = [];

        // Игровое состояние
        let healthLeft = 10;
        let healthRight = 10;
        let currentQIndex = 0;
        let gameActive = true;
        let waitingForAction = false;
        let gameOverFlag = false;

        // Серийные счетчики
        let correctStreak = 0;
        let wrongStreak = 0;

        // DOM элементы
        const healthLeftFill = document.getElementById('healthLeftFill');
        const healthLeftText = document.getElementById('healthLeftText');
        const healthRightFill = document.getElementById('healthRightFill');
        const healthRightText = document.getElementById('healthRightText');
        const questionDiv = document.getElementById('questionText');
        const optionsDiv = document.getElementById('optionsContainer');
        const gameMessageDiv = document.getElementById('gameMessage');
        const restartBtn = document.getElementById('restartButton');

        // Изображения и контейнеры
        const leftImg = document.getElementById('leftFighterImg');
        const rightImg = document.getElementById('rightFighterImg');
        const leftContainer = document.getElementById('leftSpriteBox');
        const rightContainer = document.getElementById('rightSpriteBox');

        // Спрайты
        const LEFT_IDLE = "https://s.fotora.ru/8ef7a84f80a6d51b.png";
        const LEFT_PUNCH = "https://s.fotora.ru/77852c7e30a10732.png";
        const LEFT_KICK  = "https://s.fotora.ru/4a869d8176ff13fd.png";
        const RIGHT_IDLE = "https://s.fotora.ru/217d626d77e43593.png";
        const RIGHT_PUNCH = "https://s.fotora.ru/46613df7480f3b4e.png";
        const RIGHT_KICK  = "https://s.fotora.ru/e5ae6d9d5eea473c.png";

        // Функция для показа красной линии поверх конкретной тени (targetContainer)
        function showImpactOnTarget(targetContainer) {
            // Удаляем старый оверлей, если есть
            const oldOverlay = targetContainer.querySelector('.impact-overlay');
            if (oldOverlay) oldOverlay.remove();
            
            const overlay = document.createElement('div');
            overlay.className = 'impact-overlay';
            targetContainer.style.position = 'relative';
            targetContainer.appendChild(overlay);
            // принудительно запускаем opacity
            setTimeout(() => { overlay.style.opacity = '1'; }, 5);
            setTimeout(() => {
                if (overlay) overlay.style.opacity = '0';
                setTimeout(() => {
                    if (overlay && overlay.parentNode) overlay.remove();
                }, 100);
            }, 500);  // горит 0.5 секунды
        }

        // Анимация удара со сменой спрайта на 500 мс и возвратом
        function animateAttack(attackerSide, attackType, targetContainerForLine) {
            return new Promise((resolve) => {
                let imgElement = (attackerSide === 'left') ? leftImg : rightImg;
                let idleSrc = (attackerSide === 'left') ? LEFT_IDLE : RIGHT_IDLE;
                let attackSrc = '';
                if (attackType === 'punch') attackSrc = (attackerSide === 'left') ? LEFT_PUNCH : RIGHT_PUNCH;
                else attackSrc = (attackerSide === 'left') ? LEFT_KICK : RIGHT_KICK;
                
                // меняем спрайт на удар
                imgElement.src = attackSrc;
                // лёгкое смещение атакующего
                if (attackerSide === 'left') leftContainer.style.transform = 'translateX(12px)';
                else rightContainer.style.transform = 'translateX(-12px)';
                
                // показываем красную линию на цели (передан контейнер цели)
                if (targetContainerForLine) {
                    showImpactOnTarget(targetContainerForLine);
                }
                
                // через 500 мс возвращаем стойку
                setTimeout(() => {
                    imgElement.src = idleSrc;
                    if (attackerSide === 'left') leftContainer.style.transform = '';
                    else rightContainer.style.transform = '';
                    resolve();
                }, 500);
            });
        }

        // Эффект получения удара (встряска)
        function hitEffect(targetSide) {
            const container = (targetSide === 'left') ? leftContainer : rightContainer;
            container.classList.add('hit-shake');
            setTimeout(() => container.classList.remove('hit-shake'), 300);
        }

        // Обновление полосок здоровья
        function updateHealthUI() {
            const percentLeft = (healthLeft / 10) * 100;
            const percentRight = (healthRight / 10) * 100;
            healthLeftFill.style.width = `${percentLeft}%`;
            healthLeftText.innerText = `ЗДОРОВЬЕ: ${Math.floor(percentLeft)}%`;
            healthRightFill.style.width = `${percentRight}%`;
            healthRightText.innerText = `ЗДОРОВЬЕ: ${Math.floor(percentRight)}%`;
        }

        // Проверка окончания игры
        function checkGameOver() {
            if (!gameActive) return true;
            if (healthLeft <= 0) {
                gameActive = false;
                gameOverFlag = true;
                gameMessageDiv.innerHTML = "💀 ВЫ ПРОИГРАЛИ 💀<br>Тень падает... Курс переговоров сильнее!";
                leftImg.classList.add('fall-down');
                disableOptions(true);
                restartBtn.style.display = 'inline-block';
                return true;
            } else if (healthRight <= 0) {
                gameActive = false;
                gameOverFlag = true;
                gameMessageDiv.innerHTML = "🏆 ВЫ ВЫИГРАЛИ! 🏆<br>Курс продаж повержен! Мастерство победило!";
                rightImg.classList.add('fall-down');
                disableOptions(true);
                restartBtn.style.display = 'inline-block';
                return true;
            }
            return false;
        }

        function disableOptions(disabled) {
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(btn => {
                if (disabled) btn.disabled = true;
                else btn.disabled = false;
            });
        }

        // Загрузка вопроса с перемешанными вариантами
        function loadQuestion() {
            if (!gameActive || gameOverFlag) return;
            if (currentQIndex >= shuffledQuestions.length) {
                shuffledQuestions = RAW_QUESTIONS.map(q => shuffleOptions(q));
                currentQIndex = 0;
            }
            const q = shuffledQuestions[currentQIndex];
            questionDiv.innerText = q.text;
            optionsDiv.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.classList.add('opt-btn');
                btn.innerText = `${String.fromCharCode(65+idx)}. ${opt}`;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => handleAnswer(idx));
                optionsDiv.appendChild(btn);
            });
            disableOptions(false);
        }

        // Основная логика ответа с сериями
        async function handleAnswer(selectedIdx) {
            if (!gameActive || waitingForAction || gameOverFlag) return;
            waitingForAction = true;
            disableOptions(true);

            const q = shuffledQuestions[currentQIndex];
            const isCorrect = (selectedIdx === q.correct);
            
            let damage = 1;
            let attackType = 'punch';
            let attacker = isCorrect ? 'left' : 'right';
            let targetSide = isCorrect ? 'right' : 'left';

            // Серийные бонусы
            if (isCorrect) {
                if (correctStreak >= 1) {
                    damage = 2;
                    attackType = 'kick';
                    correctStreak = 0;
                    wrongStreak = 0;
                } else {
                    damage = 1;
                    attackType = 'punch';
                    correctStreak = 1;
                    wrongStreak = 0;
                }
            } else {
                if (wrongStreak >= 1) {
                    damage = 2;
                    attackType = 'kick';
                    wrongStreak = 0;
                    correctStreak = 0;
                } else {
                    damage = 1;
                    attackType = 'punch';
                    wrongStreak = 1;
                    correctStreak = 0;
                }
            }

            // Определяем контейнер цели для красной линии
            const targetContainer = (targetSide === 'left') ? leftContainer : rightContainer;
            
            if (attacker === 'left') {
                // обучающийся бьет курс
                let newHealth = healthRight - damage;
                healthRight = Math.max(0, newHealth);
                updateHealthUI();
                await animateAttack('left', attackType, targetContainer);
                hitEffect('right');
            } else {
                // курс бьет обучающегося
                let newHealth = healthLeft - damage;
                healthLeft = Math.max(0, newHealth);
                updateHealthUI();
                await animateAttack('right', attackType, targetContainer);
                hitEffect('left');
            }

            const ended = checkGameOver();
            if (!ended) {
                currentQIndex++;
                loadQuestion();
            } else {
                disableOptions(true);
            }
            waitingForAction = false;
        }

        // Рестарт игры
        function restartGame() {
            healthLeft = 10;
            healthRight = 10;
            currentQIndex = 0;
            gameActive = true;
            gameOverFlag = false;
            waitingForAction = false;
            correctStreak = 0;
            wrongStreak = 0;
            
            leftImg.classList.remove('fall-down');
            rightImg.classList.remove('fall-down');
            leftContainer.style.transform = '';
            rightContainer.style.transform = '';
            leftImg.src = LEFT_IDLE;
            rightImg.src = RIGHT_IDLE;
            
            updateHealthUI();
            gameMessageDiv.innerHTML = '';
            restartBtn.style.display = 'none';
            
            shuffledQuestions = RAW_QUESTIONS.map(q => shuffleOptions(q));
            currentQIndex = 0;
            loadQuestion();
            disableOptions(false);
        }

        // Инициализация
        function init() {
            shuffledQuestions = RAW_QUESTIONS.map(q => shuffleOptions(q));
            leftImg.src = LEFT_IDLE;
            rightImg.src = RIGHT_IDLE;
            updateHealthUI();
            loadQuestion();
            restartBtn.addEventListener('click', () => restartGame());
        }
        
        init();
    })();
</script>
</body>
</html>
